<!DOCTYPE html>
<html lang="vi">
<head></head>
<body>
        <!-- 1. Giữ nguyên khung iframe gốc -->
<iframe id="target-player" 
        width="1" 
        height="1" 
        style="opacity: 0; position: absolute; top: 0; left: 0;" 
        class="" 
        frameborder="0" 
        allow="autoplay">
</iframe>

<!-- 2. Đoạn script độc lập điều khiển phát ngẫu nhiên -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
            const Src = ['fHIqymvGLM8', 'DgVkYLalF6c'];
    const Si = ['OGIZ3Pf4ATVKeQN0', '7LmWVedde8fhTKEr']; 
    const x = Math.round(Math.random() * Src.length);
    const embedUrl = `https://www.youtube-nocookie.com/embed/${Src[x]}?si=${Si[x]}&start=0&autoplay=1&loop=1`;
    const iframe = document.getElementById('target-player');
    iframe.src = embedUrl;
    console.log(embedUrl);
    }, 1);
});
</script>

</body>
</html>
