<html lang="vi"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Chess Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    
    <!-- 1. Tên club + chữ chạy -->
    <div class="header">
      <div class="marquee">
        <span id="clubName">❄️ CHESS WINTER CLUB ❄️</span>
      </div>
    </div>

    <!-- 2. Luật club -->
    <div class="section">
      <h2>📜 Luật Câu Lạc Bộ</h2>
      <ul class="rules">
        <li>Chơi fair play, không cheat.</li>
        <li>Tôn trọng thành viên khác.</li>
        <li>Tham gia giải đấu hàng tuần.</li>
        <li>Chia sẻ kiến thức và phân tích ván đấu.</li>
      </ul>
    </div>

    <!-- 3. 4 nút 2x2 -->
    <div class="section">
      <h2>🎮 Trò Chơi &amp; Thách Đấu</h2>
      <div class="grid-2x2">
        <a href="https://www.chess.com/play/online" class="btn-game">⚔️ Chơi online</a>
        <a href="https://www.chess.com/play/online/tournaments" class="btn-game">🏆 Giải đấu</a>
        <a href="https://www.chess.com/clubs/events/winter-chess-club-1" class="btn-game">Sự kiện clb</a>
        <a href="https://neal.fun/" class="btn-game">🎮Neal fun</a>
      </div>
    </div>

    <!-- 4. Bảng vinh danh -->
    <div class="section">
      
      <div id="leaderBoard" class="leaderboard"></div>
    </div>

    <!-- 5. Gửi phản hồi -->
    <div class="section">
      <h2>💬 Gửi Phản Hồi</h2>
      <textarea id="sendFeedbackInput" placeholder="Nhập ý kiến hoặc góp ý của bạn..."></textarea>
      <button id="sendFeedbackButton">Gửi ❄️</button>
    </div>

  </div>

  <script src="script.js"></script>

</body></html>
