<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Chess.com Club Counter</title>
</head>
<body>
<div style="
position:absolute;
top:0;
left:0;
width:420px;
height:290px;
background:#1f1f1f;
border:solid 5px #dada00;
border-radius:12px;
">

<p style="
letter-spacing:0.7px;
font-weight:750;
font-size:23px;
font-family:Arial;
color:#fafafa;
position:absolute;
top:20px;
left:50px;
">
☕ Số thành viên hiện tại:
</p>

<b id="rs" style="
font-size:49px;
font-family:Arial;
color:#fafafa;
position:absolute;
top:120px;
left:143px;
">
...
</b>
<p style="
font-family:Arial;
color:#aaaaaa;
position:absolute;
top:210px;
left:100px;
">
( Được cập nhật mỗi 5 phút )
</p>
</div>
<script>
async function updateMemberCount() {
    try {
        const response = await fetch(
            'https://api.chess.com/pub/club/never-give-up-club-1/members'
        );
        const data = await response.json();
        const total =
            data.weekly.length +
            data.monthly.length +
            data.all_time.length
        document.getElementById('rs').textContent = total;
    } catch (err) {
        document.getElementById('rs').textContent = 'ERR';
        console.error(err);
    }
}
updateMemberCount();
setInterval(updateMemberCount, 300000);
</script>

</body>
</html>
